name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 5 * * 1"
  push:
    branches: ["master"]
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Analyze supply-chain posture
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default GITHUB_TOKEN cannot read classic branch protection rules
          # (no "administration" scope exists for it), so Branch-Protection fails
          # with an internal error. A fine-grained PAT with Administration:
          # Read-only, stored as the SCORECARD_TOKEN secret, fixes that. Falls
          # back to github.token — the action's own default — when the secret is
          # absent, so every other check keeps working either way.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
