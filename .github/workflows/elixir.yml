name: Elixir CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, analyze, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore Mix cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('mix.exs', 'mix.lock') }}

      - name: Install dependencies
        run: |
          mix deps.get --check-locked
          MIX_ENV=test mix deps.get --check-locked

      - name: Check dependency lock
        run: mix deps.unlock --check-unused

      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile property test dependencies without warnings
        run: bash scripts/compile-property-deps.sh

      - name: Compile without warnings
        run: |
          mix compile --warnings-as-errors
          MIX_ENV=test mix compile --warnings-as-errors

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Run strict Credo
        run: mix credo --strict --all

      - name: Run tests
        run: timeout 60s mix test --no-compile
